<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Your DataGem Password</title>
</head>
<body style="margin: 0; padding: 0; background-color: #05070A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #F1F5F9;">
  <div style="max-width: 550px; margin: 30px auto; background: #090D14; border: 1px solid #1E293B; border-radius: 16px; overflow: hidden;">
    <div style="height: 4px; background: linear-gradient(90deg, #0284c7, #38bdf8);"></div>
    <div style="padding: 32px; text-align: center;">
      <h2 style="color: #FFFFFF; font-size: 20px; margin: 0 0 12px 0;">Password Reset Request</h2>
      <p style="color: #94A3B8; font-size: 13px; line-height: 1.6; margin: 0 0 24px 0;">
        We received a request to reset your password for your DataGem account. Use the one-time verification code below:
      </p>

      <div style="background: #05070A; border: 1px dashed #38BDF8; border-radius: 12px; padding: 18px; margin: 0 auto 24px auto; max-width: 240px;">
        <span style="font-family: monospace; font-size: 28px; font-weight: 700; letter-spacing: 6px; color: #38BDF8;">
          {{ otp_code }}
        </span>
      </div>

      <p style="color: #64748B; font-size: 11px; margin: 0;">
        This verification code expires in 15 minutes. If you did not request this, you can safely ignore this email.
      </p>
    </div>
  </div>
</body>
</html>
