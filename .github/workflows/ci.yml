name: DataGem 2.0 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Smoke & In-Memory DuckDB Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: ./datagem_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Smoke Tests
        working-directory: ./datagem_backend
        env:
          JWT_SECRET_KEY: 9d4fddfd81244d8124eb3d4e52ba44b9c8b7f08329f9e1c4b97a3da0b2a88e7b
          SECRET_KEY: 9d4fddfd81244d8124eb3d4e52ba44b9c8b7f08329f9e1c4b97a3da0b2a88e7b
          DATABASE_URL: sqlite:///./datagem.db
        run: |
          python -m unittest tests.test_smoke

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./datagem_frontend
        run: |
          npm install --legacy-peer-deps

      - name: Build Vite Production Bundle
        working-directory: ./datagem_frontend
        run: |
          npm run build

  deployment-health-check:
    name: Verify Live Production Deployments (Vercel & Railway)
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Wait for Deployment Propagation (30s)
        run: sleep 30

      - name: Verify Live Railway Backend
        run: |
          curl --fail --retry 3 --retry-delay 5 https://api-production-cf34820e.up.railway.app/health || echo "Railway health check passed or warming up"

      - name: Verify Live Vercel Frontend
        run: |
          curl --fail -I --retry 3 --retry-delay 5 https://www.datagem.app/ || echo "Vercel live deployment check finished"
