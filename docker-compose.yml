version: '3.8'

services:
  # 1. API Gateway
  api_gateway:
    build: 
      context: ./datagem_microservices/api_gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
      - chat_service
      - voice_service
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8001
      - CHAT_SERVICE_URL=http://chat_service:8002
      - VOICE_SERVICE_URL=http://voice_service:8003

  # 2. Auth Service
  auth_service:
    build:
      context: ./datagem_microservices/auth_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./datagem.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-datagem_secret_dev_key_123}

  # 3. Chat Service
  chat_service:
    build:
      context: ./datagem_microservices/chat_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:///./datagem.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./sandbox_outputs:/app/sandbox_outputs

  # 4. Voice Service
  voice_service:
    build:
      context: ./datagem_microservices/voice_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  # 5. Frontend
  frontend:
    build:
      context: ./datagem_frontend
      dockerfile: Dockerfile
    ports:
      - "5188:80"
    depends_on:
      - api_gateway
